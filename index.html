<!doctype html>
<html>
<head>
    <meta charset="utf-8">

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        AFRAME.registerComponent('videohandler', {
            init: function () {

                const marker = this.el;

                const videoSrc = marker.querySelector('a-video')
                    .getAttribute('src');

                const video = document.querySelector(videoSrc);

                marker.addEventListener('markerFound', () => {

                    console.log('FOUND:', marker.id);

                    // Dừng tất cả video khác
                    document.querySelectorAll('video').forEach(v => {
                        if (v !== video) {
                            v.pause();
                        }
                    });

                    video.muted = false;
                    video.volume = 1;

                    const promise = video.play();

                    if (promise !== undefined) {
                        promise.catch(err => {
                            console.log('Play error:', err);
                        });
                    }
                });

                marker.addEventListener('markerLost', () => {

                    console.log('LOST:', marker.id);

                    video.pause();
                });
            }
        });
    </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    gesture-detector
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>

        <video
            id="vid"
            src="assets/asset7.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            playsinline
            webkit-playsinline>
        </video>

        <video
            id="vid1"
            src="assets/sach3.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            playsinline
            webkit-playsinline>
        </video>

    </a-assets>

    <!-- Marker 1 -->
    <a-marker
        id="marker1"
        type="pattern"
        preset="custom"
        url="assets/marker7.patt"
        videohandler
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.05"
        smoothThreshold="2">

        <a-video
            src="#vid"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            gesture-handler>
        </a-video>

    </a-marker>

    <!-- Marker 2 -->
    <a-marker
        id="marker2"
        type="pattern"
        preset="custom"
        url="assets/marker3.patt"
        videohandler
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.05"
        smoothThreshold="2">

        <a-video
            src="#vid1"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            gesture-handler>
        </a-video>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
