<!doctype html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
<script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}

#startAR{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    z-index:999999;
    cursor:pointer;
}
</style>

<script>

let audioUnlocked = false;

AFRAME.registerComponent('videohandler', {
    schema:{
        target:{type:'selector'}
    },

    init:function(){

        const marker = this.el;
        const video = this.data.target;

        marker.addEventListener('markerFound', () => {

            if(!audioUnlocked) return;

            document.querySelectorAll('video').forEach(v => {
                if(v !== video){
                    v.pause();
                    v.currentTime = 0;
                }
            });

            video.play().catch(err=>{
                console.log(err);
            });

        });

        marker.addEventListener('markerLost', () => {

            video.pause();
            video.currentTime = 0;

        });

    }
});

window.addEventListener('load', () => {

    const btn = document.getElementById('startAR');

    btn.addEventListener('click', async () => {

        const videos = document.querySelectorAll('video');

        for(const v of videos){

            try{

                v.muted = true;

                await v.play();

                v.pause();
                v.currentTime = 0;

                v.muted = false;

            }catch(e){
                console.log(e);
            }

        }

        audioUnlocked = true;

        btn.style.display = "none";

    });

});

</script>

</head>

<body>

<div id="startAR">
CHẠM ĐỂ BẮT ĐẦU AR
</div>

<a-scene
embedded
gesture-detector
vr-mode-ui="enabled:false"
loading-screen="enabled:false"
arjs="sourceType:webcam; debugUIEnabled:false;">

<a-assets>

<video id="vid"  src="assets/asset7.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>
<video id="vid1" src="assets/sach3.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>
<video id="vid2" src="assets/sach4.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>
<video id="vid3" src="assets/sach5.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>
<video id="vid4" src="assets/sach2.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>
<video id="vid5" src="assets/asset.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" muted></video>

</a-assets>

<!-- Marker 1 -->
<a-marker
type="pattern"
url="assets/marker7.patt"
id="marker7"
videohandler="target:#vid">

<a-video
src="#vid"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<!-- Marker 2 -->
<a-marker
type="pattern"
url="assets/marker3.patt"
id="marker3"
videohandler="target:#vid1">

<a-video
src="#vid1"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<!-- Marker 3 -->
<a-marker
type="pattern"
url="assets/marker4.patt"
id="marker4"
videohandler="target:#vid2">

<a-video
src="#vid2"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<!-- Marker 4 -->
<a-marker
type="pattern"
url="assets/marker5.patt"
id="marker5"
videohandler="target:#vid3">

<a-video
src="#vid3"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<!-- Marker 5 -->
<a-marker
type="pattern"
url="assets/marker2.patt"
id="marker2"
videohandler="target:#vid4">

<a-video
src="#vid4"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<!-- Marker 6 -->
<a-marker
type="pattern"
url="assets/marker.patt"
id="marker1"
videohandler="target:#vid5">

<a-video
src="#vid5"
position="0 0.1 0"
rotation="-90 0 0"
scale="1 1 1"
gesture-handler>
</a-video>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>
</html>
