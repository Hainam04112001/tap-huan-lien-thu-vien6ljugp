<!doctype html>
<html>
<head>
    <meta charset="utf-8">

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <script>
        let audioUnlocked = false;

        AFRAME.registerComponent('videohandler', {
            schema: {
                target: { type: 'selector' }
            },

            init: function () {

                const marker = this.el;
                const video = this.data.target;

                marker.addEventListener('markerFound', () => {

                    if (audioUnlocked) {
                        video.muted = false;
                    }

                    video.play().catch(err => {
                        console.log("Play blocked:", err);
                    });

                });

                marker.addEventListener('markerLost', () => {

                    video.pause();
                    video.currentTime = 0;

                });

            }
        });

        window.addEventListener('load', () => {

            const startBtn = document.getElementById('startAR');

            startBtn.addEventListener('click', () => {

                audioUnlocked = true;

                document.querySelectorAll('video').forEach(v => {
                    v.muted = false;
                });

                startBtn.style.display = 'none';

            });

        });
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #startAR {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.9);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="startAR">
    CHẠM ĐỂ BẬT ÂM THANH AR
</div>

<a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
    gesture-detector
    arjs="sourceType: webcam; debugUIEnabled: false;"
>

    <a-assets>
        <!-- Người bình thường tử tế -->
        <video
            id="vid"
            src="assets/asset7.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>

        <!-- Học tập và làm theo tấm gương đạo đức HCM -->
        <video
            id="vid1"
            src="assets/sach3.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>

         <!-- Sổ tay phòng chống mã độc và tấn công mạng -->
        <video
            id="vid2"
            src="assets/sach4.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>

        <!-- Giáo sư, viện sĩ Trần Đại Nghĩa -->
        <video
            id="vid3"
            src="assets/sach2.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>

    <!-- Lịch sử phong trào học sinh, sinh viên VN và hội sinh viên VN -->
         <video
            id="vid4"
            src="assets/sach5.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>

    <!-- Việt nam non sông gấm vóc Việt Nam -->
        <video
            id="vid5"
            src="assets/asset.mp4"
            preload="auto"
            loop
            crossorigin="anonymous"
            webkit-playsinline
            playsinline
            muted
        ></video>
    </a-assets>

    <!-- Người bình thường tử tế -->
    <a-marker
        id="marker7"
        type="pattern"
        url="assets/marker7.patt"
        videohandler="target: #vid"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true"
        raycaster="objects: .clickable"
        cursor="fuse: false; rayOrigin: mouse;"
    >

        <a-video
            src="#vid"
            position="0 0.5 -0.5"
            rotation="-90 0 0"
            scale="3 3 3"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>

    <!-- Học tập và làm theo tấm gương đạo đức HCM -->
    <a-marker
        id="marker3"
        type="pattern"
        url="assets/marker3.patt"
        videohandler="target: #vid1"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true"
        raycaster="objects: .clickable"
        cursor="fuse: false; rayOrigin: mouse;"
    >

        <a-video
            src="#vid1"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>

    <!-- Sổ tay phòng chống mã độc và tấn công mạng -->
        <a-marker
            id="marker4"
            type="pattern"
            url="assets/marker4.patt"
            videohandler="target: #vid2"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            emitevents="true"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;"
        >

        <a-video
            src="#vid2"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>

    <!-- Giáo sư, viện sĩ Trần Đại Nghĩa -->
        <a-marker
            id="marker2"
            type="pattern"
            url="assets/marker2.patt"
            videohandler="target: #vid3"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            emitevents="true"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;"
        >

        <a-video
            src="#vid3"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>

     <!-- Lịch sử phong trào học sinh, sinh viên VN và hội sinh viên VN -->
        <a-marker
            id="marker5"
            type="pattern"
            url="assets/marker5.patt"
            videohandler="target: #vid4"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            emitevents="true"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;"
        >

        <a-video
            src="#vid4"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>

    <!-- Việt nam non sông gấm vóc Việt Nam -->
    <a-marker
            id="marker"
            type="pattern"
            url="assets/marker.patt"
            videohandler="target: #vid5"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            emitevents="true"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;"
        >

        <a-video
            src="#vid5"
            position="0 0.1 0"
            rotation="-90 0 0"
            scale="1 1 1"
            class="clickable"
            gesture-handler
        ></a-video>

    </a-marker>
    
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
