<!doctype html>
<html>

<head>
    <meta charset="utf-8">

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('videohandler', {
            init: function () {

                const marker = this.el;

                const videoSrc = marker.querySelector('a-video')
                    .getAttribute('src');

                const currentVideo = document.querySelector(videoSrc);

                marker.addEventListener('markerFound', () => {

                    console.log("FOUND:", marker.id);

                    document.querySelectorAll('video').forEach(v => {

                        if (v !== currentVideo) {
                            v.pause();
                        }

                    });

                    currentVideo.play()
                        .catch(err => {
                            console.log(err);
                        });
                });

                marker.addEventListener('markerLost', () => {

                    console.log("LOST:", marker.id);

                    currentVideo.pause();

                });
            }
        });

        window.addEventListener("click", () => {

            document.querySelectorAll("video").forEach(v => {

                v.muted = false;

                v.play()
                    .then(() => v.pause())
                    .catch(() => { });

            });

        }, {
            once: true
        });
    </script>

</head>

<body style="margin:0;overflow:hidden;">

    <a-scene embedded
        vr-mode-ui="enabled:false"
        loading-screen="enabled:false"
        renderer="antialias:true;precision:mediump;"
        arjs="sourceType:webcam;debugUIEnabled:false;">

        <a-assets>

            <video id="vid"
                src="assets/asset7.mp4"
                preload="metadata"
                crossorigin="anonymous"
                playsinline
                webkit-playsinline
                loop>
            </video>

            <video id="vid1"
                src="assets/sach3.mp4"
                preload="metadata"
                crossorigin="anonymous"
                playsinline
                webkit-playsinline
                loop>
            </video>

        </a-assets>

        <!-- Marker 1 -->
        <a-marker id="marker1"
            type="pattern"
            url="assets/marker7.patt"
            videohandler
            emitevents="true"
            smooth="false">

            <a-video src="#vid"
                width="0.56"
                height="1"
                position="0 0 0"
                rotation="-90 0 0">
            </a-video>

        </a-marker>

        <!-- Marker 2 -->
        <a-marker id="marker2"
            type="pattern"
            url="assets/marker3.patt"
            videohandler
            emitevents="true"
            smooth="false">

            <a-video src="#vid1"
                width="0.56"
                height="1"
                position="0 0 0"
                rotation="-90 0 0">
            </a-video>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
