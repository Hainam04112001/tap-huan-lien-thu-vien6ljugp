<!doctype html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script>
AFRAME.registerComponent('videohandler', {
    schema: {
        video: {type: 'string'}
    },

    init: function () {
        const marker = this.el;
        const video = document.querySelector(this.data.video);

        marker.addEventListener('markerFound', () => {
            if(video){
                video.currentTime = 0;
                video.play();
            }
        });

        marker.addEventListener('markerLost', () => {
            if(video){
                video.pause();
            }
        });
    }
});
</script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    loading-screen="enabled:false"
    arjs="sourceType:webcam; debugUIEnabled:false;">

    <a-assets>

        <video id="vid1"
            src="assets/video1.mp4"
            preload="auto"
            loop
            muted
            playsinline
            webkit-playsinline>
        </video>

        <video id="vid2"
            src="assets/sach3.mp4"
            preload="auto"
            loop
            muted
            playsinline
            webkit-playsinline>
        </video>

    </a-assets>

    <!-- Marker 1 -->
    <a-marker
        type="pattern"
        url="assets/marker1.patt"
        emitevents="true"
        videohandler="video:#vid1">

        <a-video
            src="#vid1"
            width="1.5"
            height="0.84"
            position="0 0 0"
            rotation="-90 0 0">
        </a-video>

    </a-marker>

    <!-- Marker 2 -->
    <a-marker
        type="pattern"
        url="assets/marker3.patt"
        emitevents="true"
        videohandler="video:#vid2">

        <a-video
            src="#vid2"
            width="1.5"
            height="0.84"
            position="0 0 0"
            rotation="-90 0 0">
        </a-video>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
